version: 0.2

env:
  variables:
    HOME: "/root"
    GOCACHE: "/tmp/go-cache"

phases:
  install:
    commands:
      - go version
      - mkdir -p "$GOCACHE"

  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/Capstone_project/order-management"
      - go mod download

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/Capstone_project/order-management"
      - go build ./...

  post_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/Capstone_project/order-management"
      - go test ./...
      - go vet ./...
      - echo "Build completed successfully."

artifacts:
  files:
    - '**/*'
  base-directory: 'Capstone_project/order-management'